<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New User</title>
    <link rel="stylesheet" href="/frontend/register.css">
    <script>
    async function checkAccess() {
        try {
            // We call the session check endpoint we created in app.py
            const response = await fetch('/verify-session');
            
            if (response.status !== 200) {
                // If not authorized (401), jump to login immediately
                window.location.href = "/frontend/login.html";
            }
        } catch (error) {
            // If the server is down or network fails
            window.location.href = "/frontend/login.html";
        }
    }
    // Execute the lock immediately
    checkAccess();
</script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="/frontend/dashboard.html" class="nav-link">Go to Dashboard</a>
        </div>
        <div class="nav-right">
            <a href="/frontend/index.html" class="nav-link">Back to Attendance</a>
        </div>
    </nav>
    <div class="layout-wrapper">
    <div class="register-container">
        <header>
            <h2>Register Face</h2>
            <p class="header-subtitle">Capture your face for attendance</p>
        </header>

        <main>
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
            </div>

            <input type="text" id="userName" placeholder="Enter Full Name" 
                   aria-label="Full Name input">
            <input type="email" id="userEmail" placeholder="Enter Email Address" 
                   aria-label="Email input">
            <input type="text" id="userDept" placeholder="Enter Department" 
                   aria-label="Department input">

            <button id="registerBtn">Capture & Register</button>

            <p id="status">Status: Ready</p>
        </main>
    </div>

    <!-- Staff Management List beside the register-container -->
    <div class="staff-management-card">
        <h3>Registered Staff</h3>
        <div class="staff-table-container">
            <table class="staff-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Dept</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="staffTableBody">
                    <!-- JavaScript Dynamic Population -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Site Management Card -->
    <div class="staff-management-card">
        <h3>On-Site Locations</h3>
        
        <div class="add-site-form" style="padding: 15px; background: rgba(255,255,255,0.03); border-radius: 5px; margin-bottom: 15px;">
            <input type="text" id="siteName" placeholder="Site Name (e.g., Project X)" class="modal-input">
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="number" id="siteLat" placeholder="Latitude" class="modal-input" step="any">
                <input type="number" id="siteLon" placeholder="Longitude" class="modal-input" step="any">
            </div>
            <input type="number" id="siteRadius" placeholder="Radius (meters)" class="modal-input" style="margin-top: 10px;">
            <button id="addSiteBtn" class="modal-btn-save" style="width: 100%; margin-top: 10px;">Add New Site</button>
            <p id="siteStatus" style="font-size: 12px; text-align: center; margin-top: 10px; min-height: 1em;"></p>
        </div>

        <div class="staff-table-container">
            <table class="staff-table">
                <thead>
                    <tr>
                        <th>Site Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="sitesTableBody"></tbody>
            </table>
        </div>
    </div>
    </div>

    <canvas id="canvas"></canvas>
    
    <!-- Edit Modal -->
    <div id="editUserModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Edit Staff</h3>
            <input type="hidden" id="editUserId">
            <input type="text" id="editUserName" placeholder="Full Name" class="modal-input">
            <input type="email" id="editUserEmail" placeholder="Email Address" class="modal-input">
            <input type="text" id="editUserDept" placeholder="Department" class="modal-input">
            <div class="modal-actions">
                <button onclick="closeModal()" class="modal-btn-cancel">Cancel</button>
                <button onclick="submitEdit()" class="modal-btn-save">Save</button>
            </div>
        </div>
    </div>

    <!-- Edit Site Modal -->
    <div id="editSiteModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Edit On-Site Location</h3>
            <input type="hidden" id="editSiteId">
            <input type="text" id="editSiteName" placeholder="Site Name" class="modal-input">
            <input type="number" id="editSiteLat" placeholder="Latitude" class="modal-input" step="any">
            <input type="number" id="editSiteLon" placeholder="Longitude" class="modal-input" step="any">
            <input type="number" id="editSiteRadius" placeholder="Radius (meters)" class="modal-input">
            <div class="modal-checkbox-container" style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="editSiteActive" style="width: auto;">
                <label for="editSiteActive" style="color: white; font-size: 14px;">Is Active</label>
            </div>
            <div class="modal-actions">
                <button onclick="closeSiteModal()" class="modal-btn-cancel">Cancel</button>
                <button onclick="submitSiteEdit()" class="modal-btn-save">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="/frontend/register.js"></script>
</body>
</html>
